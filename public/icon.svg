<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="#FF6B35"/>

  <!-- Plate / circle -->
  <circle cx="256" cy="270" r="150" fill="#FFFBF5"/>
  <circle cx="256" cy="270" r="120" fill="#FFF0E6"/>

  <!-- Smiley face on plate (kibun = mood) -->
  <!-- Eyes -->
  <circle cx="216" cy="252" r="14" fill="#5C3D2E"/>
  <circle cx="296" cy="252" r="14" fill="#5C3D2E"/>
  <!-- Eye highlights -->
  <circle cx="210" cy="246" r="5" fill="#FFFBF5"/>
  <circle cx="290" cy="246" r="5" fill="#FFFBF5"/>
  <!-- Smile -->
  <path d="M210 290 Q256 330 302 290" fill="none" stroke="#5C3D2E" stroke-width="10" stroke-linecap="round"/>

  <!-- Chopsticks -->
  <line x1="360" y1="100" x2="280" y2="340" stroke="#5C3D2E" stroke-width="10" stroke-linecap="round"/>
  <line x1="390" y1="110" x2="310" y2="350" stroke="#5C3D2E" stroke-width="10" stroke-linecap="round"/>

  <!-- Small stars (tonight sparkle) -->
  <circle cx="100" cy="100" r="8" fill="#FFFBF5" opacity="0.9"/>
  <circle cx="140" cy="150" r="5" fill="#FFFBF5" opacity="0.7"/>
  <circle cx="80" cy="170" r="4" fill="#FFFBF5" opacity="0.5"/>
</svg>
